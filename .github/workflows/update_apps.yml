name: Weekly App Scraping

on:
  schedule:
    - cron: '0 0 * * 0' # التشغيل الأسبوعي تلقائياً كل يوم أحد (UTC)
  workflow_dispatch: # إمكانية التشغيل اليدوي

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-play-scraper

      - name: Run Scraper
        run: python weakly_scraping_apps.py

      - name: Commit and Push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add apps_data.json
          git diff --quiet && git diff --staged --quiet || (git pull --rebase && git commit -m "Update Apps Data: $(date -u +'%Y-%m-%d %H:%M UTC')" && git push)
